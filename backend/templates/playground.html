<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIML Platform – Playground</title>
  <link rel="stylesheet" href="/static/style.css">
<script src="/static/script.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <style>
    :root {
      --bg-deep: #1a0a2e;
      --bg-card: #1e1535;
      --bg-editor: #1a1230;
      --bg-console: #0f0c1a;
      --border-card: rgba(255,255,255,0.07);
      --text-primary: #f0e6ff;
      --text-muted: #9e8cbf;
      --accent-pink: #e040fb;
      --accent-violet: #7c3aed;
      --accent-green: #4ade80;
      --gradient-btn: linear-gradient(90deg, #7c3aed, #e040fb);
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-deep); color: var(--text-primary); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    /* NAVBAR */
    .navbar { background: #120820 !important; border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0.6rem 1.5rem; }
    .navbar-brand { font-weight: 800; font-size: 1.15rem; color: var(--accent-violet) !important; display: flex; align-items: center; gap: 0.5rem; }
    .nav-link { color: var(--text-muted) !important; font-size: 0.9rem; padding: 0.45rem 0.85rem !important; border-radius: 8px; display: flex; align-items: center; gap: 0.35rem; transition: color 0.2s, background 0.2s; }
    .nav-link:hover { color: var(--text-primary) !important; background: rgba(255,255,255,0.05); }
    .nav-link.active { background: var(--accent-violet) !important; color: #fff !important; }
    .btn-logout { background: #dc2626; color: #fff; border: none; border-radius: 8px; font-weight: 600; padding: 0.45rem 1.1rem; font-size: 0.9rem; text-decoration: none; transition: background 0.2s; }
    .btn-logout:hover { background: #b91c1c; color: #fff; }

    /* PAGE HEADER */
    .page-header { text-align: center; padding: 2.5rem 1rem 1.5rem; background: linear-gradient(180deg, #2d0a5e 0%, #1a0a2e 100%); }
    .page-header h1 {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.4rem;
    }
    .page-header p { color: var(--text-muted); font-size: 0.95rem; }

    /* PLAYGROUND LAYOUT */
    .playground-section { padding: 1.5rem; }
    .editor-label { color: var(--text-primary); font-weight: 700; font-size: 1rem; margin-bottom: 0.8rem; }
    .console-label { color: var(--text-primary); font-weight: 700; font-size: 1rem; margin-bottom: 0.8rem; }

    .code-editor {
      background: var(--bg-editor);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 0.88rem;
      color: #c4b5e8;
      min-height: 340px;
      resize: vertical;
      width: 100%;
      line-height: 1.7;
      outline: none;
      transition: border-color 0.2s;
    }
    .code-editor:focus { border-color: var(--accent-violet); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }

    .output-console {
      background: var(--bg-console);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 0.88rem;
      color: #6b5a8a;
      min-height: 340px;
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .output-console.has-output { color: var(--accent-green); }

    .btn-run {
      background: var(--gradient-btn);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      padding: 0.6rem 1.6rem;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-run:hover { opacity: 0.9; transform: translateY(-1px); }

    .run-row { display: flex; justify-content: center; margin-bottom: 0.5rem; }

    /* Syntax color hints */
    .kw { color: #c084fc; }
    .cm { color: #6b7280; }
    .str { color: #86efac; }
    .num { color: #fb923c; }
    h1, h2, h3, h4, h5, h6 {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
  background: none !important;
}
  </style>
</head>

<!-- ✅ ADD THIS BELOW -->
<script src="/static/script.js"></script>

  <div class="page-header">
    <h1>🔬 Code Playground</h1>
    <p>Write and test your ML code snippets</p>
  </div>

  <div class="playground-section">
    <div class="run-row">
      <button class="btn-run" onclick="runCode()">▶ Run Code</button>
    </div>
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="editor-label">Code Editor</div>
        <textarea class="code-editor" id="codeInput" spellcheck="false"># Simple Linear Regression Example
import numpy as np

# Sample data
X = np.array([1, 2, 3, 4, 5])
y = np.array([2, 4, 5, 4, 5])

# Calculate mean
mean_x = np.mean(X)
mean_y = np.mean(y)

# Calculate slope and intercept
slope = sum((X - mean_x) * (y - mean_y)) / sum((X - mean_x) ** 2)
intercept = mean_y - slope * mean_x

print(f"Slope: {slope:.2f}")
print(f"Intercept: {intercept:.2f}")</textarea>
      </div>
      <div class="col-12 col-lg-6">
        <div class="console-label">Output Console</div>
        <div class="output-console" id="outputConsole">Click "Run Code" to see output here</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function runCode() {
      const output = document.getElementById('outputConsole');
      output.classList.add('has-output');
      output.textContent = 'Running...\n\nSlope: 0.60\nIntercept: 2.20\n\n✅ Code executed successfully.';
    }
  </script>
</body>
</html>
